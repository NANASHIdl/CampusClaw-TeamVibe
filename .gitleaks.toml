# gitleaks 配置：在默认规则之上，只排除「不是本仓库源码」的路径。
#
# 为什么需要它：CI 先 `npm ci` 再跑门禁，`node_modules/` 里是第三方打包产物
# （如 sass.dart.js，单文件 6 万行），`generic-api-key` 必然在里面命中，
# 与本仓库是否泄露密钥毫无关系。不排除就是「狼来了」，久了没人看这条告警。
#
# 排除范围刻意收窄到依赖与构建产物；**源码、规约、文档一律照扫**——
# 把 docs/ 或 openspec/ 排除出扫描范围才是放宽（见 03-安全开发规范 §4）。

[extend]
useDefault = true

[allowlist]
description = "第三方依赖、构建产物、缓存与版本库内部文件"
# 用 (^|[\\/]) 而不是写死 `/`：Windows 上 gitleaks 给出的路径是反斜杠，
# 只写 `node_modules/` 在本地会失效（CI 是 Linux 反而通过），这种「本地红、CI 绿」
# 或者反过来的偏差最容易骗人。
paths = [
  '''(^|[\\/])node_modules[\\/]''',
  '''(^|[\\/])dist[\\/]''',
  '''(^|[\\/])\.venv[\\/]''',
  '''(^|[\\/])venv[\\/]''',
  '''(^|[\\/])__pycache__[\\/]''',
  '''(^|[\\/])\.pytest_cache[\\/]''',
  '''(^|[\\/])\.mypy_cache[\\/]''',
  '''(^|[\\/])\.ruff_cache[\\/]''',
  '''(^|[\\/])\.git[\\/]''',
]
