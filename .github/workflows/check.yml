name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest

    # 第 3 课起有了迁移文件，`make check` 里的 api-migrate 会真跑
    # `alembic check && alembic downgrade -1 && alembic upgrade head`，三步都要连库。
    # 骨架期 `migrations/versions/` 是空的，该项直接跳过，所以旧 workflow 不配库也能绿——
    # 现在不配就会红在「连不上数据库」，红的原因与代码对错无关。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campusclaw
          POSTGRES_PASSWORD: campusclaw
          POSTGRES_DB: campusclaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusclaw -d campusclaw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # 后端配置是必填项校验（core/config.py），缺一项 get_settings() 就抛 ValidationError。
    # 向量的外部服务在单测里用不到，这里只填能通过校验的占位值；
    # 任何形似密钥的值都不写进仓库，SESSION_SECRET 在执行门禁那一步现场生成。
    env:
      APP_ENV: test
      WEB_PORT: "8080"
      DATABASE_URL: postgresql+asyncpg://campusclaw:campusclaw@localhost:5432/campusclaw
      QDRANT_URL: http://localhost:6333
      LLM_BASE_URL: http://127.0.0.1:9/llm
      LLM_API_KEY: ci-key
      LLM_MODEL: ci-model
      EMBEDDING_MODEL: ci-embed

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 版本全部钉住：门禁工具的版本变化会让「同样的代码忽绿忽红」，
      # 与 05 §1 可复现构建的要求一致。升级时要单独提一条变更。
      - name: 安装后端依赖与门禁工具
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock
          pip install pip-audit
          npm install -g @fission-ai/openspec@1.15.0
          curl -sSL --retry 3 --retry-delay 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      # 前端依赖不装，web-lint / web-types / web-test 会直接报「找不到命令」而不是报代码问题
      - name: 安装前端依赖
        run: cd frontend && npm ci --no-audit --no-fund

      - name: 文档与规约门禁
        run: make check-docs

      # 只审生产依赖：devDependencies（eslint / vitest / playwright）不进最终镜像，
      # 它们的告警单独分诊，不让构建工具链的 CVE 阻断业务门禁。
      - name: 依赖漏洞扫描
        run: |
          pip-audit -r backend/requirements.lock
          cd frontend && npm audit --omit=dev --audit-level=high

      - name: 代码门禁
        run: |
          # SESSION_SECRET 要求 ≥32 字符；现场生成，仓库里不留字面密钥
          export SESSION_SECRET="$(head -c 24 /dev/urandom | base64 | tr -d '\n')"
          make check
