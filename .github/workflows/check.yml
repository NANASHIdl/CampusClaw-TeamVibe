name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 版本全部钉住：门禁工具的版本变化会让「同样的代码忽绿忽红」，
      # 与 05 §1 可复现构建的要求一致。升级时要单独提一条变更。
      - name: 安装后端依赖与门禁工具
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock
          pip install pip-audit
          npm install -g @fission-ai/openspec@1.15.0
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      # 前端依赖不装，web-lint / web-types / web-test 会直接报「找不到命令」而不是报代码问题
      - name: 安装前端依赖
        run: cd frontend && npm ci --no-audit --no-fund

      - name: 文档与规约门禁
        run: make check-docs

      # 只审生产依赖：devDependencies（eslint / vitest / playwright）不进最终镜像，
      # 它们的告警单独分诊，不让构建工具链的 CVE 阻断业务门禁。
      - name: 依赖漏洞扫描
        run: |
          pip-audit -r backend/requirements.lock
          cd frontend && npm audit --omit=dev --audit-level=high

      - name: 代码门禁
        run: make check
