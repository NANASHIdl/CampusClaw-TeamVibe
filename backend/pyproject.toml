[project]
name = "campusclaw-teamvibe-api"
version = "0.0.1"
description = "CampusClaw · TeamVibe 后端：按班级隔离的课程知识库与解题助手"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<0.33",
    "alembic>=1.20,<1.21",
    "structlog>=26.1,<27",
    "httpx>=0.28,<0.29",
    "qdrant-client>=1.20,<1.21",
    "bcrypt>=5,<6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<2.5",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # 测试里用 assert 是正常的
    "RUF001", "RUF002", "RUF003",  # 中文全角标点在注释里是刻意为之
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "eval: 提示词评测集（第 6 组落地，需要真实模型）",
]
